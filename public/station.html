<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Station Details | Safety Dashboard</title>
    <meta name="description" content="Individual Station Safety Record">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container" style="position: relative;">
        <div style="display: flex; justify-content: space-between; align-items: center; position: absolute; top: 2rem; left: 4vw; right: 4vw;">
            <a href="/" class="back-btn" style="position: relative; top: 0; left: 0;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                Back
            </a>
            <button id="theme-toggle" class="btn" style="background: transparent; border: 1px solid var(--card-border); color: var(--text-primary); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; padding: 0; z-index: 10;">🌙</button>
        </div>

        <main id="station-content" class="station-page-container">
            <div id="loading" class="loading">Loading station data...</div>
            <div id="station-details" class="hidden">
                <div id="station-name" class="station-page-code">Station --</div>
                <div id="injury-days" class="station-page-days">--</div>
                <div class="station-page-label">Injury-Free Days</div>
                <div class="station-page-date">Last Injury Date: <span id="last-injury-date">--</span></div>
            </div>
            <div id="error-message" class="hidden error-message" style="font-size: 1.5rem;"></div>
        </main>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/station.js"></script>
</body>
</html>
