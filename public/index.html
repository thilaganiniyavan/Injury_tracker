<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Rise Dashboard | Injury-Free Days</title>
    <meta name="description" content="Company Star Rise Dashboard tracking injury-free days across all stations.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <img src="/images/starrise.png" alt="Star Rise Logo" class="starrise-img">
            </div>
            <div>
                <h1>Star Rise Dashboard</h1>
                <p class="subtitle">Live Tracking of Injury-Free Days across all stations</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">
                    DARK
                </button>
                <div class="logo-placeholder">
                    <img src="/images/logo.png" alt="Company Logo" class="logo-img">
                </div>
            </div>
        </header>

        <main>
            <div id="loading" class="loading">Loading station data...</div>
            <div id="stations-grid" class="stations-grid hidden">
                <!-- Station cards will be injected here via JS -->
            </div>

            <section class="posters-section">
                <h2 class="posters-title">Safety Campaign Showcase</h2>
                <div class="posters-grid">
                    <div class="poster-card">
                        <img src="/images/launchposter.jpeg" alt="Safety Campaign Launch Poster 1" class="poster-img">
                    </div>
                    <div class="poster-card">
                        <img src="/images/launchposter2.jpeg" alt="Safety Campaign Launch Poster 2" class="poster-img">
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/main.js"></script>
</body>
</html>
