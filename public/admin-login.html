<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Star Rise Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700;900&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>Admin Login</h1>
                <p class="subtitle">Secure access area</p>
            </div>
            <div style="display: flex; gap: 1rem; align-items: center;">
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">DARK</button>
                <img src="/images/logo.png" alt="Company Logo" class="logo-img">
            </div>
        </header>

        <main class="login-container">
            <div class="glass-card">
                <form id="login-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control" required autocomplete="username">
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" required autocomplete="current-password">
                    </div>
                    <div id="login-error" class="error-message hidden"></div>
                    <div class="form-group" style="margin-top: 2rem;">
                        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">Login</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="/js/theme.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
